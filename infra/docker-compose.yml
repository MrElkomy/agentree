# Development stack. Credentials below are local-only placeholders, not secrets.
name: agentree-dev

x-api-image: &api-image
  build:
    context: ../apps/api
    dockerfile: ../../infra/Dockerfile.api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: agentree
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentree"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Development mail catcher: UI at http://localhost:8025, SMTP on 1025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # One-shot: create the app/migrator roles, then migrate as the schema owner.
  migrate:
    <<: *api-image
    environment:
      AGENTREE_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres_dev_only@postgres:5432/agentree
      AGENTREE_APP_DB_PASSWORD: app_dev_only
      AGENTREE_MIGRATOR_DB_PASSWORD: migrator_dev_only
      AGENTREE_MIGRATION_DATABASE_URL: postgresql+asyncpg://agentree_migrator:migrator_dev_only@postgres:5432/agentree
      AGENTREE_DATABASE_URL: postgresql+asyncpg://agentree_app:app_dev_only@postgres:5432/agentree
    command: ["sh", "-c", "python -m agentree.core.db_roles && alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    environment:
      AGENTREE_ENVIRONMENT: dev
      # Unprivileged role only: the API refuses to start with a role that can bypass RLS.
      AGENTREE_DATABASE_URL: postgresql+asyncpg://agentree_app:app_dev_only@postgres:5432/agentree
      AGENTREE_SMTP_HOST: mailpit
      AGENTREE_SMTP_PORT: "1025"
      AGENTREE_PUBLIC_BASE_URL: http://localhost:3000
      AGENTREE_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      # Local http only. Production keeps the default (Secure, __Host- cookie).
      AGENTREE_SESSION_COOKIE_SECURE: "false"
      # Dev-only BYOK vault master key (base64 of the ASCII text "dev-only-master-key-000..."). Never use outside local dev.
      # Browser E2E sets this to true so chats work without a real AI key (dev only).
      AGENTREE_LLM_DEMO_MODE: ${AGENTREE_LLM_DEMO_MODE:-false}
      AGENTREE_MASTER_KEY: ZGV2LW9ubHktbWFzdGVyLWtleS0wMDAwMDAwMDAwMDA=  # gitleaks:allow (dev-only)
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  pgdata:
