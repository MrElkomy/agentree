[project]
name = "agentree"
version = "0.1.0"
description = "Agentree API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "cryptography>=43.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentree"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608", "E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["agentree", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_package = "agentree"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is a foundation layer and must not import feature modules"
type = "forbidden"
source_modules = ["agentree.core"]
forbidden_modules = [
    "agentree.health", "agentree.identity", "agentree.tenancy", "agentree.main", "agentree.worker",
    "agentree.providers", "agentree.llm",
]

[[tool.importlinter.contracts]]
name = "tenancy and identity domain code does not depend on the HTTP layer"
type = "forbidden"
source_modules = [
    "agentree.tenancy.context", "agentree.tenancy.db", "agentree.tenancy.models",
    "agentree.tenancy.rls", "agentree.tenancy.roles", "agentree.tenancy.service",
    "agentree.identity.models", "agentree.identity.passwords", "agentree.identity.service",
]
forbidden_modules = ["fastapi", "agentree.main", "agentree.health"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "identity does not depend on tenancy"
type = "forbidden"
source_modules = ["agentree.identity"]
forbidden_modules = ["agentree.tenancy"]

[[tool.importlinter.contracts]]
name = "llm adapters are independent of the rest of the application"
type = "forbidden"
source_modules = ["agentree.llm"]
forbidden_modules = ["agentree.identity", "agentree.tenancy", "agentree.providers", "agentree.main", "fastapi"]
