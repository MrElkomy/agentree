[project]
name = "agentree"
version = "0.1.0"
description = "Agentree API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentree"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["agentree", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_package = "agentree"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is a foundation layer and must not import feature modules"
type = "forbidden"
source_modules = ["agentree.core"]
forbidden_modules = ["agentree.health", "agentree.tenancy", "agentree.main", "agentree.worker"]

[[tool.importlinter.contracts]]
name = "tenancy does not depend on the HTTP layer"
type = "forbidden"
source_modules = ["agentree.tenancy"]
forbidden_modules = ["agentree.health", "agentree.main", "fastapi"]
allow_indirect_imports = true
