[project]
name = "agentree"
version = "0.1.0"
description = "Agentree API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "cryptography>=43.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentree"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608", "E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["agentree", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_package = "agentree"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is a foundation layer and must not import feature modules"
type = "forbidden"
source_modules = ["agentree.core"]
forbidden_modules = [
    "agentree.health", "agentree.identity", "agentree.tenancy", "agentree.main", "agentree.worker",
    "agentree.providers", "agentree.llm", "agentree.knowledge", "agentree.agents",
    "agentree.retention", "agentree.public", "agentree.audit", "agentree.actions",
    "agentree.leads",
]

[[tool.importlinter.contracts]]
name = "tenancy and identity domain code does not depend on the HTTP layer"
type = "forbidden"
source_modules = [
    "agentree.tenancy.context", "agentree.tenancy.db", "agentree.tenancy.models",
    "agentree.tenancy.rls", "agentree.tenancy.roles", "agentree.tenancy.service",
    "agentree.identity.models", "agentree.identity.passwords", "agentree.identity.service",
]
forbidden_modules = ["fastapi", "agentree.main", "agentree.health"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "identity does not depend on tenancy"
type = "forbidden"
source_modules = ["agentree.identity"]
forbidden_modules = ["agentree.tenancy"]

[[tool.importlinter.contracts]]
name = "llm adapters are independent of the rest of the application"
type = "forbidden"
source_modules = ["agentree.llm"]
forbidden_modules = [
    "agentree.identity", "agentree.tenancy", "agentree.providers", "agentree.knowledge",
    "agentree.agents", "agentree.public", "agentree.main", "fastapi",
]

[[tool.importlinter.contracts]]
name = "retention depends only on core (purges via its SECURITY DEFINER function)"
type = "forbidden"
source_modules = ["agentree.retention"]
forbidden_modules = [
    "agentree.identity", "agentree.tenancy", "agentree.providers", "agentree.llm",
    "agentree.knowledge", "agentree.agents", "agentree.public", "agentree.health",
    "agentree.main", "agentree.worker", "fastapi",
]

[[tool.importlinter.contracts]]
name = "public uses other modules only through their service layer"
type = "forbidden"
source_modules = ["agentree.public"]
forbidden_modules = [
    "agentree.agents.models", "agentree.agents.api", "agentree.knowledge", "agentree.leads.models",
    "agentree.leads.api", "agentree.actions.models",
    "agentree.providers", "agentree.llm", "agentree.tenancy.models", "agentree.identity.models",
    "agentree.identity.service", "agentree.retention", "agentree.main", "agentree.worker",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "public domain code does not depend on the HTTP layer"
type = "forbidden"
source_modules = ["agentree.public.models", "agentree.public.service"]
forbidden_modules = ["fastapi", "agentree.main", "agentree.health"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "audit depends only on core, tenancy context/session and the identity service (API)"
type = "forbidden"
source_modules = ["agentree.audit"]
forbidden_modules = [
    "agentree.tenancy.service", "agentree.tenancy.models", "agentree.tenancy.api",
    "agentree.identity.models", "agentree.identity.api", "agentree.providers", "agentree.llm",
    "agentree.knowledge", "agentree.agents", "agentree.public", "agentree.retention",
    "agentree.main", "agentree.worker",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "audit domain code does not depend on the HTTP layer"
type = "forbidden"
source_modules = ["agentree.audit.models", "agentree.audit.service"]
forbidden_modules = ["fastapi", "agentree.main", "agentree.health"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the action gateway depends only on core and the tenancy context"
type = "forbidden"
source_modules = ["agentree.actions"]
forbidden_modules = [
    "agentree.tenancy.service", "agentree.tenancy.models", "agentree.tenancy.api",
    "agentree.identity", "agentree.providers", "agentree.llm", "agentree.knowledge",
    "agentree.agents", "agentree.leads", "agentree.public", "agentree.audit",
    "agentree.retention", "agentree.main", "agentree.worker", "fastapi",
]

[[tool.importlinter.contracts]]
name = "leads use other modules only through their service layer"
type = "forbidden"
source_modules = ["agentree.leads"]
forbidden_modules = [
    "agentree.agents.models", "agentree.agents.api", "agentree.actions.models",
    "agentree.tenancy.models", "agentree.tenancy.api", "agentree.identity", "agentree.public",
    "agentree.providers", "agentree.llm", "agentree.main", "agentree.worker",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "leads domain code does not depend on the HTTP layer"
type = "forbidden"
source_modules = ["agentree.leads.models", "agentree.leads.service"]
forbidden_modules = ["fastapi", "agentree.main", "agentree.health"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only public and the app depend on leads"
type = "forbidden"
source_modules = [
    "agentree.identity", "agentree.tenancy", "agentree.providers", "agentree.knowledge",
    "agentree.agents", "agentree.retention", "agentree.health", "agentree.audit",
    "agentree.actions",
]
forbidden_modules = ["agentree.leads"]

[[tool.importlinter.contracts]]
name = "no other feature module depends on public"
type = "forbidden"
source_modules = [
    "agentree.identity", "agentree.tenancy", "agentree.providers", "agentree.knowledge",
    "agentree.agents", "agentree.retention", "agentree.health", "agentree.leads",
    "agentree.actions",
]
forbidden_modules = ["agentree.public"]
