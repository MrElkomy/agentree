name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTREE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_only@localhost:5432/postgres
      AGENTREE_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_only@localhost:5432/agentree_ci
      AGENTREE_APP_DB_PASSWORD: app_ci_only
      AGENTREE_MIGRATOR_DB_PASSWORD: migrator_ci_only
      AGENTREE_MIGRATION_DATABASE_URL: postgresql+asyncpg://agentree_migrator:migrator_ci_only@localhost:5432/agentree_ci
      AGENTREE_DATABASE_URL: postgresql+asyncpg://agentree_app:app_ci_only@localhost:5432/agentree_ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          version: "0.11.32"
      - name: Install Python 3.13 and dependencies
        run: |
          uv python install 3.13
          uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Module boundaries
        run: uv run lint-imports
      - name: Role bootstrap and migration round-trip (as migrator)
        run: |
          PGPASSWORD=postgres_ci_only psql -h localhost -U postgres -c "CREATE DATABASE agentree_ci"
          uv run python -m agentree.core.db_roles
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Worker starts and runs one retention pass (as agentree_app)
        # Before pytest: the test harness re-bootstraps the cluster-wide roles with test passwords.
        run: uv run python -m agentree.worker --once
      - name: Tests (real PostgreSQL)
        run: uv run pytest -v

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: |
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1
      - uses: astral-sh/setup-uv@e06108dd0aef18192324c70427afc47652e63a82 # v7.5.0
        with:
          version: "0.11.32"
      - name: pip-audit (runtime dependencies)
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit --strict --disable-pip --no-deps -r /tmp/requirements.txt

  docker:
    name: Docker dev stack smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build and start stack
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Health and readiness
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
      - name: Auth end-to-end (register, Mailpit verification, login, business, CSRF, logout)
        run: infra/smoke_auth.sh
      - name: Readiness fails when database is down, liveness stays up
        run: |
          docker compose -f infra/docker-compose.yml stop postgres
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz)
          test "$code" = "503"
          curl -fsS http://127.0.0.1:8000/healthz
      - name: Readiness recovers after database restart
        run: |
          docker compose -f infra/docker-compose.yml start postgres
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/readyz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/readyz
      - name: API runs as non-root
        run: test "$(docker compose -f infra/docker-compose.yml exec -T api id -u)" = "10001"
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  staging:
    name: Staging stack smoke test (shared-host compose)
    runs-on: ubuntu-24.04
    env:
      STAGING: docker compose -p agentree-staging -f infra/staging/docker-compose.yml --env-file /tmp/agentree-staging.env
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Throwaway secrets file (random values, discarded with the runner)
        run: |
          f=/tmp/agentree-staging.env
          {
            echo "AGENTREE_PUBLIC_HOST=demo.example.com"
            echo "AGENTREE_WEB_PORT=3103"
            echo "POSTGRES_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "AGENTREE_MIGRATOR_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "AGENTREE_APP_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "AGENTREE_MASTER_KEY=$(openssl rand -base64 32)"
            echo 'AGENTREE_MAIL_FROM="Agentree Demo <no-reply@example.com>"'
            echo "AGENTREE_SMTP_HOST=smtp.example.com"
            echo "AGENTREE_SMTP_USERNAME=ci-placeholder"
            echo "AGENTREE_SMTP_PASSWORD=ci-placeholder"
          } > "$f"
          chmod 600 "$f"
      - name: Scripts pass shellcheck
        run: shellcheck -x -P SCRIPTDIR infra/staging/*.sh
      - name: Compose file is valid
        run: $STAGING config -q
      - name: Build and start (same order as deploy.sh)
        run: |
          $STAGING build
          $STAGING up -d postgres
          $STAGING run --rm migrate
          $STAGING up -d --wait api web worker
      - name: Web serves the app and proxies /api to the API
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3103/login)" = "200"
          # Unauthenticated session check goes web -> api over the private network.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3103/api/auth/me)" = "401"
          # Static files from public/ (logo, widget loader) ship in the image.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3103/brand/agentree-wordmark.svg)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3103/widget.js)" = "200"
      - name: API runs in staging mode as the unprivileged role, readiness OK
        run: |
          $STAGING exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/readyz').read().decode())"
          test "$($STAGING exec -T api printenv AGENTREE_ENVIRONMENT)" = "staging"
          test "$($STAGING exec -T api id -u)" = "10001"
          test "$($STAGING exec -T web id -u)" = "10001"
      - name: Retention worker runs a purge pass as the unprivileged role
        run: |
          for i in $(seq 1 15); do
            $STAGING logs worker | grep -q 'retention purge finished' && break
            sleep 2
          done
          $STAGING logs worker | grep 'retention purge finished'
          test "$($STAGING ps --status running -q worker)" != ""
      - name: Only the web port is published, and only on loopback
        run: |
          docker ps --filter label=com.docker.compose.project=agentree-staging --format '{{.Names}} {{.Ports}}' | tee ports.txt
          test "$(grep -c -- '->' ports.txt)" = "1"
          grep -q '127.0.0.1:3103->3000/tcp' ports.txt
          if grep -q '0.0.0.0' ports.txt; then exit 1; fi
      - name: Memory caps are applied
        run: |
          for s in postgres api web worker; do
            id="$($STAGING ps -q "$s")"
            echo "$s: limit=$(docker inspect -f '{{.HostConfig.Memory}}' "$id") swap=$(docker inspect -f '{{.HostConfig.MemorySwap}}' "$id")"
            test "$(docker inspect -f '{{.HostConfig.Memory}}' "$id")" -gt 0
          done
      - name: Resource usage at idle (reference numbers for the shared host)
        run: |
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'
          docker image ls --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | grep -E 'agentree|postgres'
      - name: Logs on failure
        if: failure()
        run: $STAGING logs
      - name: Tear down
        if: always()
        run: $STAGING down -v

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    name: Web end-to-end (Playwright against the dev stack)
    runs-on: ubuntu-24.04
    needs: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AGENTREE_API_URL: http://127.0.0.1:8000
      AGENTREE_LLM_DEMO_MODE: "true"  # canned agent replies; no real AI provider in CI
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start backend stack (postgres, migrate, api, mailpit)
        run: docker compose -f infra/docker-compose.yml up -d --build
      - name: Wait for API readiness
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/readyz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8025/api/v1/info > /dev/null
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Build and start Next.js on :3000
        working-directory: apps/web
        run: |
          npm run build
          nohup npm run start > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:3000/login && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:3000/login
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        working-directory: apps/web
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: |
          cat /tmp/next.log || true
          docker compose -f infra/docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
